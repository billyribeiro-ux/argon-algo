[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "quant-intelligence-ml-brain"
version = "0.1.0"
description = "Self-Supervised Financial World Model, 5 Goal-Horizon Brains & 3-Speed Continuous Evolution Engine (Zero Human Indicators)"
readme = "QUANT_INTELLIGENCE_MASTER_ARCHITECTURE.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [
    { name = "Principal Quantitative Systems Engineering", email = "quant-arch@argon-algo.io" }
]
dependencies = [
    "numpy>=2.2.0",
    "polars>=1.20.0",
    "duckdb>=1.2.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",
    "onnx>=1.17.0",
    "safetensors>=0.5.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.6.0",
    "mamba-ssm>=2.2.0",
    "lightgbm>=4.5.0",
    "xgboost>=3.0.0",
    "shap>=0.46.0",
    "onnxruntime>=1.20.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "maturin>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ml-brain"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["ml-brain/tests"]
pythonpath = [".", "ml-brain"]

